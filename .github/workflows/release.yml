name: Release
# `pnpm release` pushes a v<version> tag; this creates the GitHub release and adds the macOS and Windows builds.
# Run it by hand with a tag to rebuild an existing release, or to release master without a local checkout.
# Master only: the create job fails for any commit that is not already on origin/master.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (v<version in package.json>); created on the chosen branch if it does not exist
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.tag }}
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  create:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release
        run: |
          # An existing tag wins over the chosen branch, so a rerun rebuilds exactly what was released.
          git checkout -q "$TAG" 2>/dev/null || true
          version="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$version" ] || { echo "::error::$TAG does not match package.json $version"; exit 1; }
          # Releases come from master only. This is the real gate: it also stops a hand-pushed tag or a dispatch on a branch.
          git fetch -q origin master
          git merge-base --is-ancestor HEAD origin/master || { echo "::error::$TAG is not on master; merge it into master and release from there"; exit 1; }
          # v1.2.3-beta1 is a prerelease: "latest" (and so the installer scripts and stable-channel updates) never points at it.
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          # The notes come from the changelog the app bundles (one source for both); every tag, beta included, has an entry (release.mjs requires it); the generated list is only the fallback for a tag pushed by hand.
          if node scripts/release-notes.mjs "${TAG#v}" > "$RUNNER_TEMP/notes.md" 2>/dev/null; then notes="--notes-file $RUNNER_TEMP/notes.md"; else notes=--generate-notes; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" $notes $pre
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        # ponytail: Apple Silicon + Windows x64 only; add macos-15-intel / windows-11-arm here when those users show up.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The macOS bundle is signed with this self-made certificate (docs/MAC_SIGNING.md); Windows ignores it.
      ADE_SIGN_IDENTITY: MoonerADE Code Signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create.outputs.sha }}
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "::error::Secret MACOS_SIGN_P12 is missing (docs/MAC_SIGNING.md); an ad hoc build would reset every user's privacy grants"; exit 1; }
          keychain="$RUNNER_TEMP/sign.keychain-db"; password=$(uuidgen)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # codesign refuses a self-made certificate nobody trusts, so trust it (for code signing) on this runner.
          security find-certificate -c "$ADE_SIGN_IDENTITY" -p "$keychain" > "$RUNNER_TEMP/sign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/sign.pem"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning | grep -F "$ADE_SIGN_IDENTITY"
          rm -f "$RUNNER_TEMP/sign.p12"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
