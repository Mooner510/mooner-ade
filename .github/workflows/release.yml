name: Release
# `pnpm release` pushes a v<version> tag; this creates the GitHub release and adds the macOS and Windows builds.
# Run it by hand with a tag to rebuild an existing release, or to release the chosen branch without a local checkout.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (v<version in package.json>); created on the chosen branch if it does not exist
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.tag }}
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release
        run: |
          # An existing tag wins over the chosen branch, so a rerun rebuilds exactly what was released.
          git checkout -q "$TAG" 2>/dev/null || true
          version="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$version" ] || { echo "::error::$TAG does not match package.json $version"; exit 1; }
          # v1.2.3-beta1 is a prerelease: "latest" (and so the installer scripts and stable-channel updates) never points at it.
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes $pre
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        # ponytail: Apple Silicon + Windows x64 only; add macos-15-intel / windows-11-arm here when those users show up.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-release.mjs
