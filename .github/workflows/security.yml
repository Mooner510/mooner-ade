name: Security
# Runs in parallel with CI (ci.yml). Each scanner is its own job so none waits on another;
# tool versions/checksums follow Mooner510/workflows ci/security-tools, run on GitHub-hosted runners.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          v=8.30.1
          curl -fsSL --retry 5 "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz" -o "$RUNNER_TEMP/g.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/g.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/g.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  osv:
    name: OSV (pnpm-lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan lockfile for known vulnerabilities
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64" -o "$RUNNER_TEMP/osv"
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  $RUNNER_TEMP/osv" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv"
          "$RUNNER_TEMP/osv" scan source --lockfile=pnpm-lock.yaml

  trivy:
    name: Trivy (misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan configuration for HIGH/CRITICAL issues
        run: |
          set -euo pipefail
          v=0.74.0
          curl -fsSL --retry 5 "https://github.com/aquasecurity/trivy/releases/download/v$v/trivy_${v}_Linux-64bit.tar.gz" -o "$RUNNER_TEMP/t.tgz"
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $RUNNER_TEMP/t.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/t.tgz" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" fs --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress --skip-version-check --skip-dirs .git --skip-dirs node_modules .

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: semgrep/semgrep@sha256:012c8fe81c14da2d7691b90fcd826ce07f460a3301442b16c460575c87d3efb6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SAST
        run: semgrep scan --config p/default --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag --error --metrics off --disable-version-check .
